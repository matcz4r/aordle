<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Aordle</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f6f7f8;
      color: #111;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    .game {
      width: 100%;
      max-width: 420px;
      text-align: center;
      padding: 12px;
      box-sizing: border-box;
    }

    h1 {
      margin: 10px 0 16px;
    }

    .board {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 18px;
    }

    .row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .tile {
      width: 52px;
      height: 52px;
      border: 2px solid #d3d6da;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 26px;
      font-weight: bold;
      text-transform: uppercase;
      background: white;
    }

    .correct {
      background: #6aaa64;
      border-color: #6aaa64;
      color: white;
    }

    .present {
      background: #c9b458;
      border-color: #c9b458;
      color: white;
    }

    .absent {
      background: #787c7e;
      border-color: #787c7e;
      color: white;
    }

    /* KEYBOARD */
    .keyboard {
      width: 100%;
      margin-top: 10px;
    }

    .key-row {
      display: flex;
      justify-content: center;
      gap: 4px;
      margin: 6px 0;
    }

    .key {
      flex: 1;
      max-width: 34px;
      height: 58px;
      background: #d3d6da;
      border-radius: 5px;
      font-weight: bold;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      cursor: pointer;
      transition: background 0.15s;
    }

    .key:active {
      transform: scale(0.95);
    }

    .wide {
      flex: 1.6;
      max-width: 80px;
      font-size: 12px;
    }

    .key.correct {
      background: #6aaa64 !important;
      color: white;
    }

    .key.present {
      background: #c9b458 !important;
      color: white;
    }

    .key.absent {
      background: #787c7e !important;
      color: white;
    }

    @media (max-width: 400px) {
      .tile {
        width: 44px;
        height: 44px;
        font-size: 22px;
      }

      .key {
        height: 52px;
        font-size: 12px;
      }
    }
  </style>
</head>

<body>
  <div class="game">
    <h1>Aordle</h1>

    <div id="board" class="board"></div>
    <div id="keyboard" class="keyboard"></div>
  </div>

  <script>
    const WORDS = [
      "AONNA",
      "LEZZO",
      "MERDA",
      "UDDIO",
      "PUZZA",
      "SUINO",
      "FIERO",
      "UZZIO",
      "PROPO",
      "SACCO",
      "UNTOH",
      "EDERA",
      "MHANZ",
      "BAGNO",
      "PEPPE",
      "LAIDO",
      "CARTA",
      "NABBO",
      "BUSTA",
      "SMUSI"
    ];

    const ANSWER =
      WORDS[Math.floor(Math.random() * WORDS.length)];

    const MAX = 6;
    let guesses = [];
    let current = "";

    const keyboardLayout = [
      "QWERTYUIOP",
      "ASDFGHJKL",
      "ZXCVBNM"
    ];

    const keyStatus = {}; // A → correct/present/absent

    function scoreGuess(guess) {
      const result = Array(5).fill("absent");
      const answerArr = ANSWER.split("");
      const used = Array(5).fill(false);

      // greens
      for (let i = 0; i < 5; i++) {
        if (guess[i] === answerArr[i]) {
          result[i] = "correct";
          used[i] = true;
        }
      }

      // yellows
      for (let i = 0; i < 5; i++) {
        if (result[i] === "correct") continue;

        for (let j = 0; j < 5; j++) {
          if (!used[j] && guess[i] === answerArr[j]) {
            result[i] = "present";
            used[j] = true;
            break;
          }
        }
      }

      return result;
    }

    function updateKeyStatus(guess, colors) {
      for (let i = 0; i < guess.length; i++) {
        const l = guess[i];
        const c = colors[i];

        const current = keyStatus[l];

        // priority: correct > present > absent
        if (c === "correct") {
          keyStatus[l] = "correct";
        } else if (
          c === "present" &&
          current !== "correct"
        ) {
          keyStatus[l] = "present";
        } else if (!keyStatus[l]) {
          keyStatus[l] = "absent";
        }
      }
    }

    function drawBoard() {
      const board = document.getElementById("board");
      board.innerHTML = "";

      for (let r = 0; r < MAX; r++) {
        const row = document.createElement("div");
        row.className = "row";

        let word = guesses[r] || "";
        if (r === guesses.length) word = current;

        let colors = guesses[r]
          ? scoreGuess(guesses[r])
          : [];

        for (let c = 0; c < 5; c++) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.textContent = word[c] || "";

          if (colors[c]) {
            tile.classList.add(colors[c]);
          }

          row.appendChild(tile);
        }

        if (guesses[r]) {
          updateKeyStatus(guesses[r], colors);
        }

        board.appendChild(row);
      }
    }

    function drawKeyboard() {
      const kb = document.getElementById("keyboard");
      kb.innerHTML = "";

      keyboardLayout.forEach((row, i) => {
        const rowDiv = document.createElement("div");
        rowDiv.className = "key-row";

        if (i === 2) {
          const enter = document.createElement("div");
          enter.className = "key wide";
          enter.textContent = "ENTER";
          enter.onclick = submitGuess;
          rowDiv.appendChild(enter);
        }

        row.split("").forEach(l => {
          const key = document.createElement("div");
          key.className = "key";

          if (keyStatus[l]) {
            key.classList.add(keyStatus[l]);
          }

          key.textContent = l;
          key.onclick = () => addLetter(l);

          rowDiv.appendChild(key);
        });

        if (i === 2) {
          const del = document.createElement("div");
          del.className = "key wide";
          del.textContent = "⌫";
          del.onclick = backspace;
          rowDiv.appendChild(del);
        }

        kb.appendChild(rowDiv);
      });
    }

    function submitGuess() {
      if (current.length !== 5) return;

      const guess = current.toUpperCase();

      if (!WORDS.includes(guess)) {
        alert("Not in dictionary");
        return;
      }

      guesses.push(guess);
      current = "";

      drawBoard();
      drawKeyboard();

      if (guess === ANSWER) {
        setTimeout(() => alert("You win!"), 100);
      } else if (guesses.length >= MAX) {
        setTimeout(() =>
          alert("Word was: " + ANSWER),
          100
        );
      }
    }

    function addLetter(l) {
      if (current.length < 5) {
        current += l;
        drawBoard();
      }
    }

    function backspace() {
      current = current.slice(0, -1);
      drawBoard();
    }

    drawBoard();
    drawKeyboard();
  </script>
</body>
</html>
